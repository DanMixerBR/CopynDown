name: Build CopynDown

on:
  workflow_dispatch: 
    inputs:
      versao_tag:
        description: 'Tag da Versão (ex: v3.0.0)'
        required: true
        default: 'v3.0.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Compilar com Nuitka (Modo Windows)
        run: |
          $CLEAN_V = ("${{ github.event.inputs.versao_tag }}" -replace '[A-Za-z]', '').Trim('.') + ".0"
          # O Nuitka já gera o CopynDown.exe dentro da pasta main.dist
          python -m nuitka --assume-yes-for-downloads --standalone --windows-console-mode=disable `
          --enable-plugin=pyside6 --windows-icon-from-ico=assets/icon_windows.ico `
          --company-name="DanMixerBR" --product-name="CopynDown" `
          --file-description="CopynDown" --copyright="MIT License" `
          --file-version="$CLEAN_V" --product-version="$CLEAN_V" `
          --output-filename=CopynDown.exe main.py

      - name: Atualizar version.txt localmente
        shell: bash
        run: echo "${{ github.event.inputs.versao_tag }}" | tr -d 'A-Za-z' > bin/version.txt
      
      - name: Estruturar Pastas e Baixar Ferramentas (CopynDown_Windows.zip)
        shell: powershell
        run: |
          # 1. Prepara a pasta core e a subpasta bin
          New-Item -ItemType Directory -Path release\core\bin
          
          # 2. Move o CopynDown.exe (e dlls) para a pasta core
          Move-Item -Path main.dist\* -Destination release\core
          Remove-Item main.dist
          
          # 3. Copia seus arquivos leves do GitHub (icon.ico, logo.png, cookies.txt, version.txt)
          Copy-Item -Path bin\* -Destination release\core\bin -Recurse
          Copy-Item -Path assets\icon_windows.ico -Destination release\core\bin\icon.ico
          
          # 4. Baixa o yt-dlp.exe
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "release\core\bin\yt-dlp.exe"
          
          # 5. Baixa o FFmpeg
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          Move-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "release\core\bin\ffmpeg.exe"
          Move-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" -Destination "release\core\bin\ffprobe.exe"
          
          # 6. Baixa o deno.exe
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "release\core\bin\"
          
          # 7. Compila o Launcher em C (Nativo) e compacta o ZIP final
          # Compila o arquivo de Recursos (Ícone + Metadados)
          windres assets\launcher.rc -O coff -o launcher.res
          
          # Compila o código C unindo o arquivo de recursos. 
          # -mwindows esconde a tela preta do CMD. -O3 aplica otimização máxima de velocidade.
          gcc assets\launcher.c launcher.res -o release\CopynDown.exe -mwindows -O3
          
          7z a -tzip -mx=9 CopynDown_Windows.zip .\release\*

      - name: Salvar o ZIP final
        uses: actions/upload-artifact@v4
        with:
          name: Release-Windows
          path: CopynDown_Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4
  
      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
  
      - name: Instalar dependências base do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk zip wget curl xz-utils
  
      - name: Instalar bibliotecas do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka
  
      - name: Compilar com Nuitka (Modo Linux)
        run: |
          # O Nuitka já gera o CopynDown dentro da pasta main.dist
          python -m nuitka --assume-yes-for-downloads --standalone --enable-plugin=pyside6 -o CopynDown main.py
  
      - name: Atualizar version.txt localmente
        shell: bash
        run: echo "${{ github.event.inputs.versao_tag }}" | tr -d 'A-Za-z' > bin/version.txt
      
      - name: Estruturar Pastas e Baixar Ferramentas (CopynDown_Linux.zip)
        run: |
          # 1. Prepara a pasta core e a subpasta bin
          mkdir -p release/core/bin
          
          # 2. Move o CopynDown (e libs nativas) para a pasta core
          mv main.dist/* release/core/
          rm -rf main.dist
          
          # 3. Copia seus arquivos leves do GitHub (icon.png, logo.png, cookies.txt, version.txt)
          cp -r bin/* release/core/bin/
          cp assets/icon_linux.png release/core/bin/icon.png
          
          # 4. Baixa o yt-dlp (Linux)
          wget -O release/core/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x release/core/bin/yt-dlp
          
          # 5. Baixa o ffmpeg (Linux)
          wget -O ffmpeg.tar.xz https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg.tar.xz
          mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg release/core/bin/ffmpeg
          mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe release/core/bin/ffprobe
          chmod +x release/core/bin/ffmpeg release/core/bin/ffprobe
          
          # 6. Baixa o deno (Linux)
          wget -O deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip deno.zip -d release/core/bin/
          chmod +x release/core/bin/deno
          
          # 7. Adiciona o instalador externo e compacta o ZIP final
          cp assets/Install_CopynDown.sh release/
          chmod +x release/Install_CopynDown.sh
          cd release
          zip -r -9 ../CopynDown_Linux.zip ./*
  
      - name: Salvar o ZIP final
        uses: actions/upload-artifact@v4
        with:
          name: Release-Linux
          path: CopynDown_Linux.zip
  
  release-and-publish:
    needs: [build-windows, build-linux] # Garante que só roda após os compiladores terminarem
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorização de segurança para o robô poder commitar os arquivos hash
    
    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4
  
      - name: Baixar ZIPs Gerados
        uses: actions/download-artifact@v4
        with:
          path: ./downloads
          merge-multiple: true # Junta os artefatos do Windows e Linux na mesma pasta
  
      - name: Calcular Hashes e Atualizar TXTs
        run: |
          # O comando sha256sum gera o código, e o awk filtra para pegar apenas as letras/números
          HASH_WIN=$(sha256sum ./downloads/CopynDown_Windows.zip | awk '{ print $1 }')
          HASH_LINUX=$(sha256sum ./downloads/CopynDown_Linux.zip | awk '{ print $1 }')
          
          # Calcula o hash dos scripts de atualização nativos
          HASH_BAT=$(sha256sum update.bat | awk '{ print $1 }')
          HASH_SH=$(sha256sum update.sh | awk '{ print $1 }')
          
          # Sobrescreve o hash_v2.txt com o prefixo 'sha256:' para maior clareza e segurança
          echo "sha256:$HASH_WIN" > hash_v2.txt
          echo "sha256:$HASH_LINUX" >> hash_v2.txt
          echo "sha256:$HASH_BAT" >> hash_v2.txt
          echo "sha256:$HASH_SH" >> hash_v2.txt

          # NOVO: Atualiza o version.txt na pasta bin do repositório
          echo "${{ github.event.inputs.versao_tag }}" | tr -d 'A-Za-z' > bin/version.txt
  
      - name: Salvar os Hashes direto no Repositório (Commit Automático)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Atualização automática de hashes para a versão ${{ github.event.inputs.versao_tag }}"
          file_pattern: "hash_v2.txt bin/version.txt"
  
      - name: Criar a Página de Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.versao_tag }}
          name: "CopynDown ${{ github.event.inputs.versao_tag }}"
          files: |
            ./downloads/CopynDown_Windows.zip
            ./downloads/CopynDown_Linux.zip
          draft: true
  

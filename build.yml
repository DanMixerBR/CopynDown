name: Build CopynDown

on:
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar bibliotecas do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Compilar com Nuitka (Modo Windows)
        run: |
          # O Nuitka já gera o CopynDown.exe dentro da pasta main.dist
          python -m nuitka --standalone --windows-console-mode=disable --enable-plugin=tk-inter --windows-icon-from-ico=bin_windows/icon.ico --company-name="DanMixerBR" --product-name="CopynDown" --file-version="25.2.0.0" --product-version="25.2.0.0" --copyright="MIT License" --output-filename=CopynDown.exe main.py

      - name: Estruturar Pastas e Baixar Ferramentas (CopynDown_Windows.zip)
        shell: powershell
        run: |
          # 1. Prepara a pasta core e a subpasta bin
          New-Item -ItemType Directory -Path release\core\bin
          
          # 2. Move o CopynDown.exe (e dlls) para a pasta core
          Move-Item -Path main.dist\* -Destination release\core
          Remove-Item main.dist
          
          # 3. Copia seus arquivos leves do GitHub (icon.ico, logo.png, cookies.txt, version.txt)
          Copy-Item -Path bin_windows\* -Destination release\core\bin -Recurse
          
          # 4. Baixa o yt-dlp.exe
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "release\core\bin\yt-dlp.exe"
          
          # 5. Baixa o FFmpeg e FFprobe
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          Move-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "release\core\bin\ffmpeg.exe"
          Move-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe" -Destination "release\core\bin\ffprobe.exe"
          
          # 6. Baixa o deno.exe
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path "deno.zip" -DestinationPath "release\core\bin\"
          
          # 7. Adiciona o atalho externo e compacta o ZIP final
          Copy-Item -Path assets\copyndown.exe -Destination release\
          Compress-Archive -Path release\* -DestinationPath CopynDown_Windows.zip

      - name: Salvar o ZIP final
        uses: actions/upload-artifact@v4
        with:
          name: Release-Windows
          path: CopynDown_Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências base do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk zip wget curl xz-utils

      - name: Instalar bibliotecas do projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Compilar com Nuitka (Modo Linux)
        run: |
          # O Nuitka já gera o CopynDown dentro da pasta main.dist
          python -m nuitka --standalone --enable-plugin=tk-inter -o CopynDown main.py

      - name: Estruturar Pastas e Baixar Ferramentas (CopynDown_Linux.zip)
        run: |
          # 1. Prepara a pasta core e a subpasta bin
          mkdir -p release/core/bin
          
          # 2. Move o CopynDown (e libs nativas) para a pasta core
          mv main.dist/* release/core/
          rm -rf main.dist
          
          # 3. Copia seus arquivos leves do GitHub (icon.png, logo.png, cookies.txt, version.txt)
          cp -r bin_linux/* release/core/bin/
          
          # 4. Baixa o yt-dlp (Linux)
          wget -O release/core/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x release/core/bin/yt-dlp
          
          # 5. Baixa o ffmpeg e ffprobe (Linux)
          wget -O ffmpeg.tar.xz https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg.tar.xz
          mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg release/core/bin/ffmpeg
          mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe release/core/bin/ffprobe
          chmod +x release/core/bin/ffmpeg release/core/bin/ffprobe
          
          # 6. Baixa o deno (Linux)
          wget -O deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip deno.zip -d release/core/bin/
          chmod +x release/core/bin/deno
          
          # 7. Adiciona o instalador externo e compacta o ZIP final
          cp assets/Install_CopynDown.sh release/
          cd release
          zip -r ../CopynDown_Linux.zip ./*

      - name: Salvar o ZIP final
        uses: actions/upload-artifact@v4
        with:
          name: Release-Linux
          path: CopynDown_Linux.zip